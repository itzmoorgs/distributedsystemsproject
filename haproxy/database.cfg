global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend mariadb-write
    bind *:3306
    default_backend galera-writers

backend galera-writers
    mode tcp
    option tcp-check
    balance first
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check backup
    server galera3 galera3:3306 check backup

listen mariadb-read
    bind *:3307
    mode tcp
    option tcp-check
    balance roundrobin
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check
    server galera3 galera3:3306 check
